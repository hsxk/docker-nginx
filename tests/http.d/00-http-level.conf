# tests/http.d/00-http-level.conf — parse target for the http.d include.
#
# Everything here is http-context config that has no business in a vhost, and
# that previously had nowhere to go except conf.d, where it was sensitive to
# filename ordering.

include /etc/nginx/snippets/real-ip.conf;

# A zone declared here must be usable from any conf.d vhost regardless of name.
limit_req_zone $binary_remote_addr zone=coverage_zone:1m rate=5r/s;

map $http_user_agent $coverage_is_bot {
    default          0;
    "~*bot|crawler"  1;
}


# NGINX 1.31 mainline JSON extraction module. Merely parsing this directive is
# intentional coverage: removing --with-http_json_module must fail nginx -t.
json_set $coverage_json_value $http_x_json_source foo;

# tests/snippet-coverage.conf — not a usable vhost, a parse target.
#
# Pulls in every snippet the examples don't, so `nginx -t` has to load all of
# them. error-pages.conf and real-ip.conf were referenced by nothing at all,
# which is how a snippet ships with a directive nginx rejects and nobody finds
# out until a user includes it.
#
# Mounted into conf.d/ by tests/validate-examples.sh. Not part of the image.
# real-ip.conf is exercised from http.d/ instead — see tests/http.d/.

server {
    listen      8443 ssl;
    server_name snippet-coverage.test;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/error-pages.conf;
    include /etc/nginx/snippets/static-cache.conf;
    include /etc/nginx/snippets/fastcgi-cache-purge.conf;

    # Required by fastcgi.conf / fastcgi-cache.conf respectively.
    set $fpm_upstream "php-fpm:9000";
    set $skip_cache   0;

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi.conf;
        include /etc/nginx/snippets/fastcgi-cache.conf;
    }

    # proxy-defaults + websocket in one location: the combination that nginx
    # rejected outright for as long as both snippets set proxy_read_timeout.
    location /proxied/ {
        include /etc/nginx/snippets/proxy-defaults.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass http://127.0.0.1:9999;
    }
}

# Test-only vhost copied into a running smoke-test container.
server {
    # Test-only port; smoke.sh publishes it on host loopback only.
    listen 8444 ssl;
    server_name header-overrides.test;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location = /normal {
        default_type text/plain;
        return 200 "normal\n";
    }

    # Covers /office, /office/*, /office-addin and /office-addin/*.
    location ~ ^/(?:office|office-addin)(?:/|$) {
        include /etc/nginx/snippets/security-headers-allow-framing.conf;
        more_set_headers "Content-Security-Policy: frame-ancestors 'self' https://office-parent.example";
        default_type text/plain;
        return 200 "office\n";
    }

    location = /custom {
        # Must replace the inherited SAMEORIGIN, not append a second XFO.
        more_set_headers "X-Frame-Options: DENY";
        default_type text/plain;
        return 200 "custom\n";
    }

    location = /oauth-popup {
        include /etc/nginx/snippets/security-headers-popup-auth.conf;
        default_type text/plain;
        return 200 "oauth\n";
    }

    location /cache-purge/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache purge_test;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 1m;
        proxy_cache_purge PURGE from all;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /brotli {
        default_type text/plain;
        return 200 "brotli-\n";
    }
}


# Blog/WordPress-style case: the login popup can be launched from many pages,
# so COOP is relaxed for this entire vhost while the other defaults stay.
server {
    listen 8444 ssl;
    server_name popup-server.test;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers-popup-auth.conf;

    location / {
        default_type text/plain;
        return 200 "popup-server\n";
    }
}


# Loopback-only origin used by /cache-purge/. The changing timestamp lets a
# human inspect whether a post-purge response really came from origin.
server {
    listen 127.0.0.1:8082;
    server_name purge-origin.test;

    location / {
        default_type text/plain;
        return 200 "origin-$msec\n";
    }
}

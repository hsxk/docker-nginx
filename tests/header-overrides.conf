# Test-only vhosts copied into a running smoke-test container.
#
# The base image must remain neutral: no application/browser security policy
# header is expected unless this fixture explicitly creates one.

server {
    listen 8444 ssl;
    server_name header-policy.test;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    # Bare application response: every managed policy header must be absent.
    location = /plain {
        default_type text/plain;
        return 200 "plain\n";
    }

    # Native nginx header ownership is allowed because the base image no
    # longer injects a competing value.
    location = /add-header {
        add_header Referrer-Policy "no-referrer" always;
        default_type text/plain;
        return 200 "add-header\n";
    }

    # headers-more remains available for applications that want replacement /
    # clearing semantics rather than native add_header behaviour.
    location = /more-set {
        more_set_headers "Permissions-Policy: geolocation=()";
        default_type text/plain;
        return 200 "more-set\n";
    }

    # Office Add-in style policy: popup communication is deliberately allowed
    # and X-Frame-Options is deliberately NOT imposed by the base image.
    location = /office-addin {
        more_set_headers "Cross-Origin-Opener-Policy: unsafe-none";
        more_set_headers "Content-Security-Policy: frame-ancestors 'self' https://office-parent.example";
        default_type text/plain;
        return 200 "office-addin\n";
    }

    # The upstream owns COOP and XFO. The proxy layer must pass each through
    # unchanged and must not append a base-image copy.
    location = /upstream-policy {
        proxy_pass http://127.0.0.1:8083/;
    }

    location /cache-purge/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache purge_test;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 1m;
        proxy_cache_purge PURGE from all;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /brotli {
        default_type text/plain;
        return 200 "brotli-\n";
    }
}

# Origin used to prove that application/upstream response policy survives the
# reverse proxy untouched.
server {
    listen 127.0.0.1:8083;
    server_name upstream-policy-origin.test;

    location / {
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        default_type text/plain;
        return 200 "upstream-policy\n";
    }
}

# Loopback-only origin used by /cache-purge/.
server {
    listen 127.0.0.1:8082;
    server_name purge-origin.test;

    location / {
        default_type text/plain;
        return 200 "origin-$msec\n";
    }
}

# tests/cache-purge-http.conf — http{} fixture for smoke.sh only.
#
# This makes ngx_cache_purge prove more than "the .so loaded": smoke.sh warms
# an entry, observes HIT, PURGEs it, then requires the next GET to be MISS.
proxy_cache_path /var/cache/nginx/proxy-purge-test
    levels=1:2
    keys_zone=purge_test:1m
    max_size=16m
    inactive=1m
    use_temp_path=off;

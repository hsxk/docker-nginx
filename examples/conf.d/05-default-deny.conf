# examples/conf.d/05-default-deny.conf — catch-all for unknown Host headers.
#
# Without this, a request to https://your-server-ip/ (no SNI / unknown vhost)
# falls through to the first server block, leaking site contents and getting
# logged against the wrong vhost. Returning 444 (nginx-specific "close without
# response") makes the connection vanish silently.
#
# Loaded before 10-/20-/30- thanks to lexical order of conf.d/*.conf.

# Plain HTTP catch-all.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTPS catch-all. Requires a cert to even complete the TLS handshake;
# entrypoint generates a self-signed _default cert at startup if missing.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include snippets/tls.conf;

    return 444;
}

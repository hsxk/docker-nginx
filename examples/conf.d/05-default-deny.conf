# examples/conf.d/05-default-deny.conf — catch-all for unknown Host headers.
#
# Without this, a request to https://your-server-ip/ (no SNI / unknown vhost)
# falls through to the first server block, leaking site contents and getting
# logged against the wrong vhost. Returning 444 (nginx-specific "close without
# response") makes the connection vanish silently.
#
# Loaded before 10-/20-/30- thanks to lexical order of conf.d/*.conf.
#
# ─── Scope: HTTPS only ──────────────────────────────────────────────────────
# There is no :80 block here. nginx allows exactly one `default_server` per
# listen address, so a plain-HTTP catch-all in this file and the one in
# 00-http-redirect.conf cannot coexist — dropping both into conf.d/ fails
# `nginx -t` outright with "a duplicate default server for 0.0.0.0:80".
#
# 00-http-redirect.conf owns :80 and is the better answer there anyway: ACME
# HTTP-01 validation arrives on port 80 addressed to a hostname nginx has no
# vhost for yet, and a 444 catch-all would black-hole it and break issuance.
# Use 00-http-redirect.conf together with this file.

# HTTPS catch-all. Requires a cert to even complete the TLS handshake;
# entrypoint generates a self-signed _default cert at startup if missing.
#
# The `quic` lines matter: TCP :443 and UDP :443 are separate sockets with
# separate default servers, so covering only `ssl` leaves every HTTP/3 request
# with an unknown SNI falling through to the first quic vhost instead.
# No `reuseport` here — 10-example-static.conf owns it for this address:port.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    listen      443 quic default_server;
    listen      [::]:443 quic default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include snippets/tls.conf;

    return 444;
}

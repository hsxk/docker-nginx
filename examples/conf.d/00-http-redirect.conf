# examples/00-http-redirect.conf
#
# Goal: every plaintext :80 request becomes a permanent redirect to :443,
#       EXCEPT Let's Encrypt's HTTP-01 challenge path which must stay plain.
#
# Drop this file into /etc/nginx/conf.d/ — it serves every hostname.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cert renewal — keep BEFORE the catch-all redirect.
    include /etc/nginx/snippets/acme-challenge.conf;

    # Container healthcheck (HEALTHCHECK in Dockerfile hits this).
    include /etc/nginx/snippets/healthz.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

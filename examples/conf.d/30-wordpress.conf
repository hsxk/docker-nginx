# examples/conf.d/30-wordpress.conf
#
# WordPress + PHP-FPM with FastCGI micro-cache and ngx_cache_purge.
# Assumes PHP-FPM container reachable at php-fpm:9000 and web root mounted
# at /var/www/html.

server {
    listen      443 quic;
    listen [::]:443 quic;
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;

    server_name wp.example.com;

    ssl_certificate     /etc/letsencrypt/live/wp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wp.example.com/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/http3.conf;
    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/static-cache.conf;

    root  /var/www/html;
    index index.php index.html;

    # Required by snippets/fastcgi.conf
    set $fpm_upstream "php-fpm:9000";

    # Cache-skip signal: built from $request_method / $http_cookie / $query_string.
    set $skip_cache 0;
    if ($request_method = POST)          { set $skip_cache 1; }
    if ($query_string  != "")            { set $skip_cache 1; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }
    if ($request_uri ~* "/(wp-admin|wp-login\.php|wp-cron\.php|xmlrpc\.php|sitemap.*\.xml)") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Block PHP execution inside upload dirs.
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi.conf;
        include /etc/nginx/snippets/fastcgi-cache.conf;
    }

    include /etc/nginx/snippets/fastcgi-cache-purge.conf;
}

# examples/conf.d/20-reverse-proxy.conf
#
# Reverse proxy to an upstream HTTP service (e.g. a Node/Python app, Immich,
# Grafana, Vaultwarden, …). Demonstrates:
#   • HTTP/3 via shared :443 listener  (no reuseport — defined in 10-…)
#   • Upstream keepalive
#   • WebSocket upgrade
#   • Per-route rate limiting

upstream app_backend {
    server app:3000;
    keepalive          32;
    keepalive_requests 1000;   # reuse each upstream conn for 1k req before recycle
    keepalive_timeout  60s;
}

server {
    listen      443 quic;
    listen [::]:443 quic;
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;

    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/http3.conf;
    include /etc/nginx/snippets/acme-challenge.conf;

    # Large upload support (e.g. photo/video backup apps like Immich).
    client_max_body_size 50000m;

    location / {
        include /etc/nginx/snippets/proxy-defaults.conf;
        include /etc/nginx/snippets/websocket.conf;

        # Streamed responses (SSE / chunked uploads) — disable buffering.
        # proxy_request_buffering off;
        # proxy_buffering         off;

        proxy_pass http://app_backend;
    }

    # Auth endpoints get the stricter limiter from snippets/auth-rate-limit.conf.
    # That snippet defines `zone=auth` in http {} — include it once from
    # a top-level conf.d/*.conf or directly from nginx.conf.
    location ~ ^/(login|register|api/auth|oauth/token)$ {
        limit_req zone=auth burst=3 nodelay;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://app_backend;
    }
}

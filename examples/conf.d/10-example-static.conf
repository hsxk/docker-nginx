# examples/conf.d/10-example-static.conf
#
# Static site with full HTTP/3 (QUIC) support, served from /var/www/html.
# Replace "example.com" with your domain, point DNS at this host, then
# obtain a cert with:
#
#     certbot certonly --webroot -w /var/www/html -d example.com
#
# Mount /etc/letsencrypt into the container read-only.
#
# NOTE on `reuseport`: across ALL of your :443 server blocks (this file plus
# any other you add), exactly ONE pair of `listen 443 quic` / `listen [::]:443
# quic` lines must carry `reuseport`. Put it on the FIRST server block that
# binds the port — typically this one. Subsequent vhosts must NOT repeat it.

server {
    listen      443 quic reuseport;
    listen [::]:443 quic reuseport;
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;

    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/http3.conf;
    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/static-cache.conf;
    include /etc/nginx/snippets/healthz.conf;

    root  /var/www/html;
    index index.html;

    limit_req  zone=req_per_ip  burst=200 nodelay;
    limit_conn conn_per_ip 50;

    location / {
        try_files $uri $uri/ =404;
    }
}

name: Docker Build

# Full CI is intentionally enabled for this public repository.
# Every job uses GitHub's standard ubuntu-latest hosted runner; no larger
# runners are used. PRs and main pushes validate all shipped flavors, while
# tag pushes additionally publish the multi-arch release image.
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: hsxk/nginx
  DOCKERFILE: mainline/alpine/Dockerfile

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Smoke test: build every ENABLE_* permutation we ship (single-arch, no
  # push). Catches regressions in optional-module integration before publish.
  # ─────────────────────────────────────────────────────────────────────────
  matrix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - { name: base,    args: "" }
          - { name: zstd,    args: "ENABLE_ZSTD=1" }
          - { name: njs,     args: "ENABLE_NJS=1" }
          # njs's xml module is opt-in because it drags libxml2/libxslt into
          # the runtime; build it too so the opt-in path can't rot.
          - { name: njs-xml, args: "ENABLE_NJS=1\nENABLE_NJS_XML=1" }
          - { name: geoip2,  args: "ENABLE_GEOIP2=1" }
          - { name: vts,     args: "ENABLE_VTS=1" }
          - { name: all,     args: "ENABLE_ZSTD=1\nENABLE_NJS=1\nENABLE_GEOIP2=1\nENABLE_VTS=1" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check upstream watcher and security-default unit tests
        if: matrix.flavor.name == 'base'
        run: python3 -m unittest discover -s tests -p 'test_nginx_update_watch.py' -v

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (${{ matrix.flavor.name }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }}
          build-args: ${{ matrix.flavor.args }}
          cache-from: type=gha,scope=${{ matrix.flavor.name }}
          cache-to:   type=gha,scope=${{ matrix.flavor.name }},mode=max

      - name: nginx -V (verify module list)
        run: docker run --rm ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }} nginx -V

      - name: nginx -t (validate shipped config)
        run: docker run --rm ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }} nginx -t

      # `nginx -t` only proves the config parses. Boot it and check it serves.
      - name: Smoke test (boot container, assert behaviour)
        run: ./tests/smoke.sh ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }}

      # The example vhosts are templates that reference certs which don't
      # exist, so they can only be validated with throwaway certs minted for
      # exactly their server_names. They have shipped broken before (two files
      # both claiming `default_server` on :80 — `nginx -t` rejects the pair).
      - name: nginx -t (validate examples/conf.d together)
        run: ./tests/validate-examples.sh ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }}

      # Only meaningful now that OpenSSL is an apk package. While it was a
      # statically linked quictls, a scanner had nothing to find — no package
      # metadata, no CVE match, an image that looked clean while carrying a
      # TLS stack frozen in April 2024. This is what closes that loop, and
      # what tells us the pinned Alpine base digest has gone stale.
      #
      # Verify the 1.31.8 baseline is clean (0 HIGH/CRITICAL in CI). Treat a future
      # fixable HIGH/CRITICAL regression as a real gate instead of report-only.
      - name: Vulnerability scan (Trivy)
        if: matrix.flavor.name == 'base'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci-${{ matrix.flavor.name }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────────────────
  # Stable aggregate check for branch protection/rulesets. Matrix job names
  # contain flavor parameters; requiring this one status is much easier to
  # keep stable over time.
  # ─────────────────────────────────────────────────────────────────────────
  ci-success:
    needs: matrix-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full matrix success
        env:
          MATRIX_RESULT: ${{ needs.matrix-build.result }}
        run: test "$MATRIX_RESULT" = "success"

  # ─────────────────────────────────────────────────────────────────────────
  # Release build: multi-arch image with provenance + SBOM.
  # Normally tag-gated; the explicit [publish-image] commit marker allows
  # a single reviewed main merge to publish *after* its full CI matrix passes.
  # Ordinary PR/main pushes NEVER publish; the weekly update watcher only
  # files issues and cannot trigger this job.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs: ci-success
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-image]')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # push a matching release tag after a successful main publish
      id-token: write   # available for keyless OIDC signing if cosign is added

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate immutable release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG NGINX_VERSION=//p' mainline/alpine/Dockerfile | head -1)"
          [[ "$version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || { echo "invalid NGINX_VERSION" >&2; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Dockerfile NGINX_VERSION $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (multi-arch, SBOM + provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release-version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-linux-amd64
            type=registry,ref=${{ env.IMAGE }}:cache-linux-arm64
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:cache-linux-amd64,mode=max
            type=registry,ref=${{ env.IMAGE }}:cache-linux-arm64,mode=max

      # GITHUB_TOKEN pushes do not recursively trigger the tag workflow;
      # the already validated job above is the release, so that is intended.
      - name: Record git release tag after successful Docker Hub publish
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERSION: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Release tag ${VERSION} already exists; verifying it points at this commit."
            remote_sha="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{print $1}')"
            test "$remote_sha" = "$GITHUB_SHA" || { echo "Release tag points to a different commit" >&2; exit 1; }
          else
            git tag "${VERSION}" "$GITHUB_SHA"
            git push origin "refs/tags/${VERSION}"
          fi

# snippets/http3.conf — advertise HTTP/3 to clients.
# Include INSIDE each TLS server { } that should be reachable via QUIC.
#
# Requires (set in the server block itself, NOT here, because `reuseport`
# must appear on exactly one listen line per address:port across the whole
# config):
#
#   listen 443 quic reuseport;   # ← only on the FIRST quic vhost
#   listen [::]:443 quic reuseport;
#   listen 443 ssl;
#   listen [::]:443 ssl;
#   http2 on;
#
# Subsequent vhosts:
#   listen 443 quic;             # no reuseport here
#   listen [::]:443 quic;
#   listen 443 ssl;
#   listen [::]:443 ssl;
#   http2 on;

# Tell the client "you can upgrade this connection to h3 next time".
# Only advertise the final h3 ALPN — h3-29/h3-28 drafts are dead.
add_header Alt-Svc 'h3=":443"; ma=86400' always;

# Mitigate amplification attacks: server returns a Retry on first packet.
quic_retry on;

# Enable GSO for fewer syscalls when sending QUIC packets (Linux 4.18+).
quic_gso on;

# Re-use TLS resumption tickets across QUIC connections (faster reconnect).
# ssl_early_data on;   # ← uncomment ONLY if you understand 0-RTT replay risks

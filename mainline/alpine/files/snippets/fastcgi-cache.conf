# snippets/fastcgi-cache.conf — micro-cache PHP responses (e.g. WordPress).
# Include INSIDE the same `location ~ \.php$` block as fastcgi.conf,
# AFTER include /etc/nginx/snippets/fastcgi.conf;
#
# The wpcache zone is defined at http {} level in nginx.conf.

fastcgi_cache        wpcache;
fastcgi_cache_valid  200 301 302 10m;
fastcgi_cache_valid  404            1m;
fastcgi_cache_lock   on;
# Stale-while-revalidate: serve the cached page immediately while a single
# worker refreshes it in the background. Halves p99 for content updates.
fastcgi_cache_background_update on;
fastcgi_cache_revalidate        on;
# No http_502 / http_504 here, however natural they look next to http_500:
# fastcgi_cache_use_stale does not accept them (502/504 are gateway statuses
# only the proxy module can produce), and nginx rejects the whole config with
# `invalid value "http_502"` rather than ignoring them.
fastcgi_cache_use_stale error timeout invalid_header updating
                        http_500 http_503 http_429;

# Ignore the app's own caching hints so short/absent Cache-Control from PHP
# does not defeat the micro-cache.
#
# Set-Cookie is deliberately NOT in this list. Adding it — as this file used
# to — tells nginx to cache responses that carry a Set-Cookie, and nginx then
# replays that stored response, cookie and all, to every subsequent visitor.
# One unlucky request while a session cookie is being issued and you are
# handing another user's session to strangers. If your app provably never sets
# a cookie on a cacheable page and you need the hit rate, add it back
# knowingly, together with `fastcgi_hide_header Set-Cookie;`.
fastcgi_ignore_headers Cache-Control Expires;

# Skip cache for logged-in users / POST / query strings — set $skip_cache
# in your server block based on $request_method, $http_cookie, $query_string.
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache     $skip_cache;

add_header X-Cache-Status $upstream_cache_status always;

# snippets/fastcgi-cache.conf — micro-cache PHP responses (e.g. WordPress).
# Include INSIDE the same `location ~ \.php$` block as fastcgi.conf,
# AFTER include /etc/nginx/snippets/fastcgi.conf;
#
# The wpcache zone is defined at http {} level in nginx.conf.

fastcgi_cache        wpcache;
fastcgi_cache_valid  200 301 302 10m;
fastcgi_cache_valid  404            1m;
fastcgi_cache_lock   on;
# Stale-while-revalidate: serve the cached page immediately while a single
# worker refreshes it in the background. Halves p99 for content updates.
fastcgi_cache_background_update on;
fastcgi_cache_revalidate        on;
fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

# Skip cache for logged-in users / POST / query strings — set $skip_cache
# in your server block based on $request_method, $http_cookie, $query_string.
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache     $skip_cache;

add_header X-Cache-Status $upstream_cache_status always;

# snippets/static-cache.conf — long-lived cache headers for immutable assets.
# Include INSIDE a server { } block.
#
# Pairs with `aio threads;` in nginx.conf: large media files served via
# directio bypass the page cache entirely (no eviction churn) and the read
# is offloaded to the thread pool so the worker stays responsive.

location ~* \.(?:jpg|jpeg|gif|png|webp|avif|ico|svg|css|js|mjs|woff|woff2|ttf|eot|otf|map|wasm|pdf|txt)$ {
    expires    30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    log_not_found off;
    try_files  $uri =404;
}

# Large media — stream from disk with O_DIRECT, never poison the page cache.
location ~* \.(?:mp4|webm|m4v|ogv|mov|mkv|iso|zip|tar|gz|7z)$ {
    expires      30d;
    add_header   Cache-Control "public, max-age=2592000";
    access_log   off;
    log_not_found off;
    directio     4m;
    output_buffers 2 1m;
    try_files    $uri =404;
}

# Hidden files (.git, .env, .htaccess, etc.) — deny everything.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

# Common cruft.
location = /favicon.ico { log_not_found off; access_log off; }
location = /robots.txt  { log_not_found off; access_log off; }

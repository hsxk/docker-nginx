# snippets/security-headers-allow-framing.conf
#
# Include INSIDE a server {} or location {} that is intentionally embeddable
# by another origin (Office Add-ins, trusted partner portals, etc.).
#
# The global security baseline sets:
#     X-Frame-Options: SAMEORIGIN
#
# headers-more executes inherited http-level directives first and this
# location/server-level clear afterwards, so the final response contains NO
# X-Frame-Options header. Do not replace this with add_header.
#
# IMPORTANT: clearing X-Frame-Options only removes the legacy framing policy.
# The caller MUST define an explicit CSP frame-ancestors allow-list in the same
# server/location, for example:
#
#     include /etc/nginx/snippets/security-headers-allow-framing.conf;
#     more_set_headers "Content-Security-Policy: frame-ancestors 'self' https://office-parent.example";
#
# Office parent origins differ by host/deployment. Keep the allow-list in the
# downstream site's config where it can be reviewed and changed; this base
# image intentionally does not hard-code Microsoft origins.
# Never use frame-ancestors * for authenticated/admin surfaces.
more_clear_headers "X-Frame-Options";

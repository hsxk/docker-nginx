# snippets/geoip2.conf — MaxMind GeoIP2 lookup. REQUIRES build with ENABLE_GEOIP2=1.
# Include inside http {} (e.g. via nginx.conf).
#
# Download the GeoLite2 DBs to /etc/nginx/geoip2/ (mount as a volume):
#   GeoLite2-Country.mmdb, GeoLite2-City.mmdb
# Sign up free at https://www.maxmind.com/en/geolite2/signup

geoip2 /etc/nginx/geoip2/GeoLite2-Country.mmdb {
    auto_reload         60m;
    $geoip2_country_code country iso_code;
    $geoip2_country_name country names en;
}

geoip2 /etc/nginx/geoip2/GeoLite2-City.mmdb {
    auto_reload     60m;
    $geoip2_city    city names en;
    $geoip2_region  subdivisions 0 names en;
}

# Usage examples inside a server { } block:
#
#   # Block requests from specific countries:
#   if ($geoip2_country_code ~ "^(KP|IR)$") { return 403; }
#
#   # Log location:
#   log_format combined_geo '$remote_addr [$geoip2_country_code] $request';

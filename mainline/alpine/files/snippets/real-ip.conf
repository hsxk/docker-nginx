# snippets/real-ip.conf — recover the true client IP behind a proxy/CDN/LB.
# Include inside http {} (from nginx.conf) or inside a server { } block.
#
# ─── Why this matters ───────────────────────────────────────────────────────
# Without it, everything downstream sees the *proxy's* address:
#   • limit_req / limit_conn key every request in the world to one bucket, so
#     the first busy client 429s everybody else;
#   • access logs record the load balancer, not the visitor;
#   • allow/deny ACLs match the wrong address — an `allow 10.0.0.0/8` in front
#     of an in-cluster ingress accidentally allows the whole internet.
#
# ─── Why it is NOT enabled by default ───────────────────────────────────────
# set_real_ip_from is a trust declaration. Every listed source may rewrite the
# client address of any request it sends you. Trust an address you do not
# actually control and you have handed out IP spoofing: attackers set
# X-Forwarded-For themselves and bypass rate limits and IP allowlists. So the
# list below must be *your* proxies and nothing else.

# ── 1. Which headers to read ────────────────────────────────────────────────
real_ip_header    X-Forwarded-For;
# Walk the XFF chain right-to-left, skipping addresses that are themselves
# trusted, and stop at the first untrusted hop — that is the real client.
# Without this nginx takes the LAST entry, which for a two-proxy chain is your
# own inner proxy.
real_ip_recursive on;

# Cloudflare hands you the client in a dedicated header that it always
# overwrites, which is harder to get wrong than parsing XFF:
#     real_ip_header CF-Connecting-IP;
#     real_ip_recursive off;

# ── 2. Which sources may set it ─────────────────────────────────────────────
# Docker bridge / compose networks and the usual private ranges. Narrow these
# to the actual addresses of your proxies if you can.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;

# ── Behind Cloudflare ───────────────────────────────────────────────────────
# Cloudflare's egress ranges change; do not paste a stale copy. Regenerate:
#     curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6 \
#       | sed 's/^/set_real_ip_from /; s/$/;/' > cloudflare.conf
# then mount it and include it here. Keep it on a refresh schedule — a range
# Cloudflare adds later arrives as untrusted, and those visitors all get
# rate-limited as one client.

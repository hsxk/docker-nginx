# snippets/proxy-defaults.conf — sane defaults for any reverse-proxy location.
# Include INSIDE a `location { }` block, BEFORE proxy_pass.

proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   X-Forwarded-Port  $server_port;

# Keep upstream connection alive (requires `keepalive N;` in the upstream{} block).
proxy_set_header   Connection        "";
# TCP-level keepalive on upstream sockets — keeps NAT/load-balancer state alive
# between low-traffic periods so we don't pay a fresh-connect tax on the next
# request.
proxy_socket_keepalive on;

# Don't let upstream override our security headers.
proxy_hide_header  X-Powered-By;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering          on;
proxy_buffer_size        16k;
proxy_buffers            8 16k;
proxy_busy_buffers_size  32k;
proxy_max_temp_file_size 0;

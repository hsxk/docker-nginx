# snippets/proxy-defaults.conf — sane defaults for any reverse-proxy location.
# Include INSIDE a `location { }` block, BEFORE proxy_pass.

proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   X-Forwarded-Port  $server_port;

# Correlation ID. Deliberately nginx's own $request_id rather than passing a
# client-supplied X-Request-ID through: the client controls that value, and
# honouring it lets anyone collide or forge the identifier your upstream logs
# and traces key on. The same value is in the access log as "id".
proxy_set_header   X-Request-ID      $request_id;

# Keep upstream connection alive (requires `keepalive N;` in the upstream{} block).
proxy_set_header   Connection        "";
# TCP-level keepalive on upstream sockets — keeps NAT/load-balancer state alive
# between low-traffic periods so we don't pay a fresh-connect tax on the next
# request.
proxy_socket_keepalive on;

# For https:// upstreams: send SNI, and validate against the proxy_pass host
# rather than whatever certificate the upstream happens to present. Without
# proxy_ssl_server_name a TLS upstream behind any kind of shared frontend
# (a CDN, another nginx, most SaaS endpoints) gets the wrong certificate or a
# handshake failure. Harmless on plain http:// upstreams.
proxy_ssl_server_name  on;
proxy_ssl_protocols    TLSv1.2 TLSv1.3;

# Don't let upstream override our security headers.
proxy_hide_header  X-Powered-By;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering          on;
proxy_buffer_size        16k;
proxy_buffers            8 16k;
proxy_busy_buffers_size  32k;
proxy_max_temp_file_size 0;

# snippets/security-headers.conf — OPTIONAL application policy example.
#
# OPT-IN ONLY. The base image does NOT include this file automatically.
#
# This snippet deliberately chooses a conventional browser-security policy and
# is therefore NOT suitable for every application. In particular, iframe
# surfaces, Microsoft Office Add-ins, OAuth popup flows, public asset hosts and
# cross-origin applications can require different CSP / COOP / XFO / CORP /
# COEP behaviour.
#
# Include it only after reviewing every header for the application that owns
# the response. Because the HSTS map below is http-context configuration, the
# intended opt-in form is from an http-level file such as:
#
#   # /etc/nginx/http.d/10-security-policy.conf
#   include /etc/nginx/snippets/security-headers.conf;
#
# Prefer application-owned server/location policy when different sites in the
# same container need different rules.
#
# headers-more remains compiled into the image so applications can use
# more_set_headers / more_clear_headers without the base image inventing a
# policy on their behalf.

# HSTS only on HTTPS. Empty value makes headers-more omit the header.
map $https $opt_in_hsts_header {
    default "";
    on      "max-age=31536000";
}

more_set_headers "Strict-Transport-Security: $opt_in_hsts_header";
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: SAMEORIGIN";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: browsing-topics=()";
more_set_headers "Cross-Origin-Opener-Policy: same-origin";

# Deliberately not included in this generic example:
#   Content-Security-Policy
#   Cross-Origin-Resource-Policy
#   Cross-Origin-Embedder-Policy
# Those require knowledge of the application's actual scripts, frames,
# resources, authentication flows and cross-origin sharing model.

# snippets/security-headers.conf — safe defaults, included from http {}.
#
# ─── Why more_set_headers and not add_header ────────────────────────────────
# `add_header` does not accumulate down the config tree: a server or location
# block that declares ANY add_header of its own drops every add_header it
# inherited. That is not a corner case here — it silently disarmed this file
# for most real traffic:
#
#   snippets/http3.conf      add_header Alt-Svc          → whole TLS vhost bare
#   snippets/static-cache.conf  add_header Cache-Control → every css/js/image bare
#   snippets/fastcgi-cache.conf add_header X-Cache-Status→ every cached page bare
#   snippets/error-pages.conf   add_header Cache-Control → every error page bare
#
# `more_set_headers` (headers-more, compiled into this image) lives in its own
# directive family, so a stray add_header downstream cannot clobber it, and it
# applies to every status code without needing `always`.
#
# It also merges the way you would expect, unlike add_header: a server or
# location block that declares its own more_set_headers gets the inherited set
# *plus* its own, with its own applied last. So overriding one header for one
# site is a one-liner in that block and the rest of this file still applies:
#     more_set_headers "X-Frame-Options: DENY";
#
# ─── Override with more_set_headers, NOT add_header ─────────────────────────
# This is the one thing to know when upgrading from an image where these were
# add_header. The two directive families do not see each other, so:
#
#     server { add_header X-Frame-Options "DENY" always; }
#
# no longer replaces the default — it appends, and the response carries BOTH
#
#     X-Frame-Options: SAMEORIGIN
#     X-Frame-Options: DENY
#
# which browsers treat as conflicting and may ignore entirely, leaving that
# site with *less* protection than either value alone. Previously that
# add_header won (at the cost of silently dropping every other header in this
# file, which is the bug this rewrite fixes).
#
# Rule: to override anything set here, repeat it as more_set_headers. Use
# add_header only for headers this file does not set.

# HSTS must never be emitted over plaintext. RFC 6797 requires clients to
# ignore it there, but sending it anyway is noise that hides real problems —
# and an operator who sees the header on :80 tends to assume it is working.
# Empty value ⇒ headers-more omits the header entirely.
map $https $hsts_header {
    default "";
    on      "max-age=31536000";
}

more_set_headers "Strict-Transport-Security: $hsts_header";

# NOT enabled by default: `includeSubDomains`. It is a one-way door — every
# subdomain, including ones that do not exist yet and any internal HTTP-only
# host under the apex, becomes unreachable in browsers that saw the header,
# for the full max-age, with no way to recall it remotely. Turn it on
# deliberately, per site, once you know every subdomain is HTTPS:
#     more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
# Add `; preload` only after submitting to https://hstspreload.org/.

# Browsers ignore X-XSS-Protection (and it has its own XSS-injection bugs)
# — do NOT enable it. CSP is the modern replacement.

more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: SAMEORIGIN";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: browsing-topics=()";
more_set_headers "Cross-Origin-Opener-Policy: same-origin";

# Cross-Origin-Resource-Policy is deliberately NOT set globally. `same-origin`
# breaks any asset this server hosts for another origin — fonts, images,
# oEmbed thumbnails, anything hotlinked by a site you do want to serve. Set it
# per site, where you know the answer:
#     more_set_headers "Cross-Origin-Resource-Policy: same-origin";  # private app
#     more_set_headers "Cross-Origin-Resource-Policy: cross-origin"; # public CDN

# `server_tokens off` already trims the version, leaving "Server: nginx".
# Uncomment to remove the header outright:
#     more_clear_headers "Server";

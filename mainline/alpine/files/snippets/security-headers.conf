# snippets/security-headers.conf — sane defaults applied at http {} level.
# Override or extend per-site by re-adding headers in the server block.

# Browsers ignore X-XSS-Protection (and it has its own XSS-injection bugs)
# — do NOT enable it. CSP is the modern replacement.

add_header X-Content-Type-Options "nosniff"                            always;
add_header X-Frame-Options        "SAMEORIGIN"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
add_header Permissions-Policy     "interest-cohort=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin"                  always;
add_header Cross-Origin-Resource-Policy "same-origin"                  always;

# HSTS: ONLY applied on TLS server blocks via "always". HTTP requests
# never see it because the redirect happens first.
# Add `preload` only after you have submitted the domain to
# https://hstspreload.org/ AND you are sure every subdomain is HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

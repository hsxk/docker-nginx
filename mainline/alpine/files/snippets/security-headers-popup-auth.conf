# snippets/security-headers-popup-auth.conf
#
# Include INSIDE a server {} or location {} whose authentication flow opens a
# cross-origin popup and needs window.opener communication (for example Google
# Identity Services when FedCM is not handling the popup).
#
# The global default remains the stricter:
#     Cross-Origin-Opener-Policy: same-origin
#
# Include at server {} scope when the popup can be launched from many pages
# (common for blogs/WordPress), or at location {} scope when a single login
# route is the only opener.
#
# This local override changes only COOP. X-Frame-Options, HSTS, nosniff,
# Referrer-Policy and Permissions-Policy continue to inherit unchanged.
#
# Use headers-more rather than add_header so the inherited COOP value is
# replaced instead of duplicated.
more_set_headers "Cross-Origin-Opener-Policy: same-origin-allow-popups";

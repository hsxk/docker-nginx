# snippets/zstd.conf — zstd compression. REQUIRES build with ENABLE_ZSTD=1.
# Include inside http {} (e.g. via nginx.conf) — see comment in nginx.conf.
#
# zstd negotiation: Chrome ≥123 and Firefox ≥126 send `Accept-Encoding: zstd`.
# Older clients fall back to br / gzip transparently.

zstd            on;
zstd_static     on;
zstd_comp_level 5;
zstd_min_length 1024;
zstd_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/atom+xml application/manifest+json application/wasm
    image/svg+xml font/woff font/woff2;

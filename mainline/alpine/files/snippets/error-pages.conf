# snippets/error-pages.conf — branded error pages.
# Include INSIDE a server { } block. Drop matching files into /var/www/html/errors/.
#
# Falls back gracefully if the static files don't exist: nginx serves the
# built-in plain-text response.

error_page 404              /errors/404.html;
error_page 500 502 503 504  /errors/5xx.html;
error_page 429              /errors/429.html;

location ^~ /errors/ {
    root /var/www/html;
    internal;
    # Make sure error pages themselves are never cached against the wrong key.
    add_header Cache-Control "no-store" always;
}

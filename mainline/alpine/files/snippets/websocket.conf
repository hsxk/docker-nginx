# snippets/websocket.conf — upgrade headers for WebSocket / SSE upstreams.
# Include INSIDE a `location { }` block AFTER proxy-defaults.conf.

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout          1h;
proxy_send_timeout          1h;

# Required for the $connection_upgrade map. That map is already defined at
# http {} level in /etc/nginx/nginx.conf — nothing extra to include.

# snippets/healthz.conf — public health endpoint for an EXTERNAL checker
# (load balancer, uptime monitor, Kubernetes probe). Include INSIDE a
# server { } block.
#
# The container's own HEALTHCHECK does NOT use this: it hits a loopback-only
# listener defined in nginx.conf, so it keeps working even when you mount your
# own conf.d. You only need this snippet if something outside the container
# has to probe a real vhost.

location = /healthz {
    access_log off;
    # default_type, not `add_header Content-Type` — add_header appends a
    # second Content-Type on top of the one nginx already derives from
    # default_type, and clients are free to pick either.
    default_type text/plain;
    return 200 "ok\n";
}

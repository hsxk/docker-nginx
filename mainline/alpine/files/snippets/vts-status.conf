# snippets/vts-status.conf — Prometheus-friendly metrics endpoint.
# REQUIRES build with ENABLE_VTS=1.
#
# Setup:
#   1. Add to http {} in nginx.conf (or via a top-level conf.d/*.conf):
#         vhost_traffic_status_zone shared:vts:10m;
#   2. Drop a server block like the one below into /etc/nginx/conf.d/.
#   3. Scrape http://nginx:9145/status/format/prometheus from your collector.
#
# DO NOT expose port 9145 to the public internet.

server {
    listen      9145;
    server_name _;

    # Lock down to the metrics network. Adjust to your CIDR.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    access_log off;

    location /status {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format prometheus;
    }
}

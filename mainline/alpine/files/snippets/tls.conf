# snippets/tls.conf — TLS defaults, include INSIDE a server { } block.
#
# Caller must set:
#   ssl_certificate     <fullchain>;
#   ssl_certificate_key <privkey>;
# BEFORE including this file.

ssl_protocols              TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers  off;
ssl_ciphers                'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_ecdh_curve             X25519:secp384r1:prime256v1;

ssl_session_cache          shared:SSL:20m;
ssl_session_timeout        1d;

# Session tickets ON.
#
# TLS 1.3 dropped session-ID resumption entirely — tickets are the only
# resumption mechanism it has. `ssl_session_tickets off` (a widely copied
# hardening line, and what this file used to say) therefore does not "harden
# TLS 1.3", it disables resumption for it outright: every connection from
# every modern browser pays a full handshake, an extra round trip and a
# signature verification.
#
# The tradeoff it buys is real but narrow: nginx generates the ticket key at
# startup and keeps it for the process lifetime, so an attacker who reads
# worker memory could decrypt recorded sessions from that period. An attacker
# with that access already has the session keys themselves. `nginx -s reload`
# rotates the key.
#
# Turn them off only if you are threat-modelling memory disclosure over long
# time horizons and have measured that you can afford the handshakes:
#     ssl_session_tickets off;
ssl_session_tickets        on;

# Smaller TLS record (default 16k) — reduces time-to-first-byte for small
# responses (HTML, JSON APIs) at a small bandwidth cost on huge transfers.
ssl_buffer_size            4k;

# OCSP stapling — needs `resolver` in the http {} block (already set).
#
# Increasingly a no-op: Let's Encrypt stopped including OCSP responder URLs in
# 2025, so for LE certificates nginx logs "no OCSP responder URL in the
# certificate" once at startup and moves on. Kept enabled because it still
# does useful work for CAs that do publish OCSP.
ssl_stapling               on;
ssl_stapling_verify        on;

# Note: ssl_dhparam intentionally NOT set. The cipher list above has no
# DHE-* suites (only ECDHE-*), and TLS 1.3 uses its own ephemeral key
# exchange. Generating dhparam.pem would just slow down the build.

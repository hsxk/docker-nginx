# snippets/acme-challenge.conf — serve Let's Encrypt HTTP-01 challenges.
# Include in your :80 server block.
#
# IMPORTANT: certbot must write to /var/www/html/.well-known/acme-challenge/
# (i.e. invoke certbot with `--webroot --webroot-path /var/www/html`).

location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root         /var/www/html;
    allow        all;
    access_log   off;
    log_not_found off;
}

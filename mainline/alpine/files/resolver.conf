# resolver.conf — REGENERATED AT CONTAINER START by docker-entrypoint.sh.
#
# Do not edit: the entrypoint overwrites this file with the nameservers found
# in the container's own /etc/resolv.conf, so nginx resolves exactly what the
# rest of the container resolves (Docker's embedded DNS at 127.0.0.11 on a
# user-defined network, the host's resolvers under `network_mode: host`, your
# corporate resolver on a VPN, …).
#
# The values below are only the fallback baked into the image, used if the
# entrypoint is bypassed or /etc/nginx is mounted read-only.
#
# To pin your own resolvers instead, mount a file over /etc/nginx/resolver.conf
# — the entrypoint skips regeneration when the file is not writable.

resolver         127.0.0.11 valid=300s ipv6=off;
resolver_timeout 5s;

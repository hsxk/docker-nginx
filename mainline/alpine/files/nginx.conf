## nginx.conf — base configuration
##
## Per-site server blocks live in /etc/nginx/conf.d/*.conf (mount your own).
## Reusable building blocks live in /etc/nginx/snippets/ — see the examples/
## directory in this repository.

user                 nginx;
worker_processes     auto;
worker_rlimit_nofile 65535;

# Enable PCRE JIT — we compiled with --with-pcre-jit, but the runtime
# directive must be set explicitly to actually JIT-compile regex location
# blocks, server_name patterns, etc. Cheap, big win on regex-heavy configs.
pcre_jit on;

# A thread pool for offloading blocking I/O (sendfile of cold pages, etc.).
# Used by `aio threads;` below.
thread_pool default threads=32 max_queue=65536;

# QUIC connection migration across workers.
#
# With `reuseport` the kernel hashes each UDP datagram to a worker by 4-tuple.
# When a client migrates (Wi-Fi → cellular, NAT rebind) its 4-tuple changes and
# its packets land on a *different* worker, which does not hold the connection
# state — the connection stalls until the client gives up and reconnects. On a
# 10-core host that is 10 reuseport sockets and a ~90% chance of landing wrong.
# `quic_bpf on` installs an eBPF socket selector that routes by QUIC connection
# ID instead, so migration keeps working.
#
# It needs CAP_BPF (or CAP_SYS_ADMIN) + CAP_NET_ADMIN, which Docker does NOT
# grant by default, and nginx *fails to start* rather than degrading when the
# capability is missing. So the decision is made at boot: docker-entrypoint.sh
# checks the container's effective capabilities and writes `quic_bpf on;` here
# only when it would actually work. Force it either way with QUIC_BPF=on|off.
#
# To grant it:  docker run --cap-add BPF --cap-add NET_ADMIN …
#               (compose: see the cap_add block in docker-compose.yml)
include /etc/nginx/quic-bpf.conf;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    ## ── Core ───────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       UTF-8;
    server_tokens off;

    server_names_hash_bucket_size 128;
    variables_hash_max_size       2048;
    types_hash_max_size           2048;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Emit relative Location headers. nginx builds absolute redirects from the
    # port it is *listening* on, which is wrong the moment the container's 443
    # is published on another port or sits behind another proxy — users end up
    # redirected to https://example.com:8443/dir/. Relative redirects sidestep
    # the whole class of bug (RFC 7231 has allowed them since 2014).
    absolute_redirect off;

    # Cap a single sendfile() so one slow client can't monopolize a worker.
    sendfile_max_chunk 2m;
    # Free up memory faster when a client goes away mid-transfer.
    reset_timedout_connection on;

    # Offload blocking disk reads/writes to the thread pool defined above.
    # Pairs with the optional `directio 4m;` in snippets/static-cache.conf for
    # large-file streaming without polluting the page cache.
    aio       threads=default;
    aio_write on;

    client_max_body_size    20m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    ## ── DNS resolver (needed for OCSP stapling + dynamic proxy_pass) ──────
    ## Generated at container start by docker-entrypoint.sh from the
    ## container's own /etc/resolv.conf. Under Docker that means the embedded
    ## DNS server (127.0.0.11), which is what makes `proxy_pass $upstream;`
    ## resolve compose service names — a hardcoded 1.1.1.1 cannot, and leaks
    ## your internal hostnames to a third party while failing.
    include /etc/nginx/resolver.conf;

    ## ── WebSocket upgrade map (used by snippets/websocket.conf) ───────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    ## ── Logging ───────────────────────────────────────────────────────────
    ## $host is deliberately first-class: without it a multi-vhost container
    ## produces one undifferentiated access log and you cannot tell which site
    ## a request hit. $request_id ties a log line to the X-Request-ID handed
    ## to the upstream (see snippets/proxy-defaults.conf).
    log_format main escape=json '{'
        '"time":"$time_iso8601",'
        '"id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"ua":"$http_user_agent",'
        '"ref":"$http_referer",'
        '"xff":"$http_x_forwarded_for",'
        '"http3":"$http3",'
        '"proto":"$server_protocol",'
        '"tls":"$ssl_protocol",'
        '"cache":"$upstream_cache_status",'
        '"upstream":"$upstream_addr",'
        '"upstream_rt":"$upstream_response_time"'
    '}';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    ## ── Compression ───────────────────────────────────────────────────────
    ## Note what is NOT in these lists: woff/woff2 (already Brotli-compressed
    ## internally — recompressing burns CPU for ~0 bytes), and every image or
    ## video type. Adding them is a common and pointless cargo-culted mistake.
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript text/markdown text/vtt
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml application/xhtml+xml
        application/manifest+json application/ld+json application/wasm
        application/vnd.api+json application/geo+json
        image/svg+xml image/x-icon;

    brotli            on;
    brotli_static     on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain text/css text/xml text/javascript text/markdown text/vtt
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml application/xhtml+xml
        application/manifest+json application/ld+json application/wasm
        application/vnd.api+json application/geo+json
        image/svg+xml image/x-icon;

    # For zstd compression on builds with ENABLE_ZSTD=1, add this line to
    # the http {} block (NOT enabled by default — would break non-zstd builds):
    #     include /etc/nginx/snippets/zstd.conf;

    ## ── File-descriptor cache ─────────────────────────────────────────────
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    ## ── Rate limiting ──────────────────────────────────────────────────────
    ## Key on the real client IP (binary form, 4× smaller than text).
    ## $binary_remote_addr reflects the real client only if real_ip is
    ## configured — behind Cloudflare or a load balancer every request
    ## otherwise shares one key and a single zone burst throttles everybody.
    ## See snippets/real-ip.conf.
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    ## Stricter zone for login / OTP / token endpoints — apply per-location
    ## via `limit_req zone=auth burst=3 nodelay;`. See examples/conf.d/20-…
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_status 429;

    ## ── FastCGI cache pool (used by snippets/fastcgi-cache.conf) ──────────
    fastcgi_cache_path /var/cache/nginx/fcgi
        levels=1:2 keys_zone=wpcache:30m max_size=512m inactive=600m use_temp_path=off;
    fastcgi_cache_key  "$scheme$request_method$host$request_uri";

    ## ── Default security headers (applied to every response) ──────────────
    include /etc/nginx/snippets/security-headers.conf;

    ## ── Container health endpoint ─────────────────────────────────────────
    ## Bound to loopback only, so it is never reachable from outside the
    ## container and never collides with a published port. Defined HERE rather
    ## than in a conf.d vhost on purpose: the Dockerfile HEALTHCHECK must keep
    ## working no matter what the operator mounts over /etc/nginx/conf.d.
    server {
        listen      127.0.0.1:8081;
        server_name _;
        access_log  off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { return 404; }
    }

    ## ── User site configs ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}

# Built-in fallback vhost.
#
# The entrypoint copies this into /etc/nginx/conf.d/default.conf ONLY IF
# /etc/nginx/conf.d/ is empty — i.e. the user did NOT mount their own
# site config. As soon as you mount a conf.d directory, this file is
# replaced by your own.
#
# Uses the self-signed cert generated at startup in /etc/letsencrypt/_default/.
# That cert exists with CN=localhost so browsers will complain — fine for a
# bare-image smoke test, never for production.

# Plain HTTP — serve healthz, redirect everything else to HTTPS.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    include snippets/healthz.conf;

    location / { return 301 https://$host$request_uri; }
}

# HTTPS — fallback cert, returns a friendly page so you can confirm the
# image is alive, plus healthz on the secure side too.
server {
    listen      443 ssl default_server reuseport;
    listen      [::]:443 ssl default_server reuseport;
    listen      443 quic default_server reuseport;
    listen      [::]:443 quic default_server reuseport;
    http2       on;

    server_name _;

    ssl_certificate     /etc/letsencrypt/_default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/_default/privkey.pem;
    include snippets/tls.conf;
    include snippets/http3.conf;
    include snippets/healthz.conf;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>docker-nginx-quic</title><style>body{font:14px/1.5 ui-sans-serif,system-ui;max-width:48em;margin:4em auto;padding:0 1em;color:#222}code{background:#f4f4f4;padding:.1em .3em;border-radius:3px}</style><h1>It works.</h1><p>This is the built-in fallback page. To serve real sites, mount your own configs into <code>/etc/nginx/conf.d/</code> \xe2\x80\x94 see the project README.</p>';
    }
}

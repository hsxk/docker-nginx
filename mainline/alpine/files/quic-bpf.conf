# quic-bpf.conf — REGENERATED AT CONTAINER START by docker-entrypoint.sh.
#
# Holds `quic_bpf on;` when the container actually has the capabilities for it
# (CAP_BPF or CAP_SYS_ADMIN, plus CAP_NET_ADMIN), and nothing otherwise —
# because nginx refuses to start if quic_bpf is set without them.
#
# See the comment above the include in nginx.conf. Override the detection with
# QUIC_BPF=on or QUIC_BPF=off in the environment.
#
# Empty by default: Docker grants neither capability unless asked.
